# cargo-deny 配置（工具版本实测 cargo-deny 0.20.2，2026-11-02）
#
# 依据：
# - SPEC.md §10「新增依赖过 cargo deny（许可白名单 MIT/Apache-2.0/BSD-3/ISC/Unicode-3.0）」
#   该 5 项为规范基线；2026-11-02 的许可决策在此基线上追加 5 项（见下方 allow 注释）。
# - 官方配置文档：https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
#   （licenses 段；0.20 的 `version` 字段已废弃，未知字段会报错）
# - 默认模板由 `cargo deny init`（0.20.2）生成后按项目裁剪。
# - 许可结论来源：docs/dev/research/slint.md（§4/§7）、docs/dev/research/deps.md（§4 Q8）、
#   docs/dev/research/pdf.md、docs/dev/research/cas.md（均为 2026-11-02 实测记录）。
#
# 项目自身许可：**GPL-3.0-only**（全文见仓库根 LICENSE）。
# 决策口径：求职展示、源码公开；不购买 Slint 商业许可、不启用 Slint Royalty-free
# 归属方案，因此 Slint 的三重许可按 GPL 分支使用。
#
# 原则：fail-closed —— 未显式允许的许可一律拒绝；未知 registry/git 来源一律拒绝。
# 新增依赖时若触发许可拒绝，先确认许可真实性，再决定：
#   1) 在此白名单加 SPDX 标识（需在 docs/dev/research/ 记录理由），或
#   2) 换成许可合规的替代 crate。

[graph]
# 不限制 target：桌面包将来可能跨平台构建，许可/来源检查应覆盖所有平台依赖。
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# 安全公告库使用默认官方源（https://github.com/rustsec/advisory-db）。
# 确有不可避免的公告时，在此按 id 忽略并写明 reason；禁止无理由长期忽略。
ignore = [
    # —— 2026-11-02 许可/公告处置（task-18，eg-platform T07–T12 依赖链）——
    # 链路：eg-platform → keyring 4.2.0（v1 API）→ zbus-secret-service-keyring-store 1.0.1
    #       → secret-service 5.2.0 → zbus 5.19.0 → zvariant 5.15.1 / zbus_names 4.3.5。
    # 这 3 条均为 **unmaintained**（非漏洞、无 CVE）：上游 2026-08 把 zvariant 系列并入
    # zbus 6.0.0（https://github.com/z-galaxy/zbus/issues/2043，已关闭），5.x 不再单独维护，
    # 公告本身标注 “No safe upgrade is available!”。keyring 4.2.0 尚未迁移到 zbus 6。
    # 该链路只在 **Linux**（非 macOS/iOS/Android 的 unix）编译：keyring 的 v1 特性为
    # 各平台按 cfg 选后端，本项目发行目标是 macOS（SPEC.md §11 环境），macOS 构建实际
    # 编译的是 apple-native-keyring-store/keychain 分支，不含 zbus，故对发行包无影响。
    # deny.toml 的 [graph] 有意不限制 target，为了让跨平台许可/来源检查也覆盖，因此
    # 不能靠 target 过滤消掉，只能按公告忽略；若将来真正支持 Linux 桌面，必须重新评估
    # 并迁移到 zbus 6 系（或改用其他 Secret Service 后端）。
    # 记录：docs/dev/research/platform.md（§9 风险与偏差）。
    "RUSTSEC-2026-0370", # zvariant 5.15.1 unmaintained：并入 zbus 6，无 5.x 安全升级
    "RUSTSEC-2026-0371", # zbus_names 4.3.5 unmaintained：同上，随 zvariant 合并
    "RUSTSEC-2026-0372", # zvariant_derive 5.15.1 unmaintained：派生宏并入 zbus 6
    # —— 2026-11-02 Slint 引入后的公告处置（task-36 T35 app 外壳）——
    # 链路：eg-app → slint 1.18.1 → i-slint-backend-winit 1.18.1 → winit 0.30.13
    #       → sctk-adwaita 0.10.1（Linux/Wayland 窗口装饰后端）→ ab_glyph 0.2.32
    #       → owned_ttf_parser 0.25.1 → ttf-parser 0.25.1。
    # 该 crate 为 unmaintained（非漏洞、无 CVE），公告标注 “No safe upgrade is available!”；
    # 上游建议迁移到 skrifa，但 Slint 1.18.1 尚未迁移（1.19 未发布）。
    # 只在 Linux/Wayland 构建编译；本项目发行目标是 macOS（SPEC.md §11 环境），
    # macOS 构建实际编译 winit 的 macOS 后端，不含 sctk-adwaita/ttf-parser 分支。
    # deny.toml 的 [graph] 有意不限制 target，因此不能靠 target 过滤消掉，只能按公告忽略；
    # 若将来支持 Linux 桌面，必须重新评估（等待 Slint 升级到 skrifa 或换装饰后端）。
    # 记录：docs/dev/research/app.md §8.4。
    "RUSTSEC-2026-0192", # ttf-parser 0.25.1 unmaintained：Slint/winit 的 Linux Wayland 装饰链
]

[licenses]
# 许可白名单（SPDX 标识，大小写与拼写必须精确；SPDX v3.11 列表）。
# 注意：带例外的许可（如 "Apache-2.0 WITH LLVM-exception"）视为不同许可，
# 需要单独列出；未列出即拒绝（fail-closed）。
allow = [
    # —— 规范基线 5 项（SPEC.md §10）——
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # —— 项目自身许可：Slint 1.18.1 的表达式为
    #    "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0"（11 个包）。
    #    本项目整体采用 GPL-3.0-only（LICENSE），因此 GPL 分支即满足其表达式；
    #    不添加 LicenseRef-* 商业/归属分支（不启用 Slint Royalty-free 归属方案、不购商业许可）。
    #    来源：docs/dev/research/slint.md §4 Q6 / §7 R3（2026-11-02 实测）。
    "GPL-3.0-only",
    # —— 图像 / PDF / 压缩链（非 Slint 链即需要这两项）——
    #    Zlib：zlib-rs → flate2 → hayro-syntax / png / tiff / zip（rust_xlsxwriter）等。
    #    BSD-2-Clause：TLS/图像链引入（具体包见 deps.md §5 的 cargo deny 输出）。
    #    来源：docs/dev/research/deps.md §4 Q8 / §5；docs/dev/research/pdf.md。
    "Zlib",
    "BSD-2-Clause",
    # —— Slint 依赖树附带（宽松许可，随框架引入）——
    #    BSL-1.0（Boost Software License 1.0，×2）：宽松、保留版权声明即可。
    #    Unlicense（公有领域声明，×1）：无附加义务。
    #    来源：docs/dev/research/slint.md §4 Q6（2026-11-02 实测的 cargo deny 拒绝清单）。
    "BSL-1.0",
    "Unlicense",
]
# 从 LICENSE 文件识别许可时的置信度门槛，使用官方默认值 0.8。
confidence-threshold = 0.8

[licenses.private]
# 本仓库所有 crate 均 publish = false，不对外分发，不需要许可声明。
ignore = true
registries = []

[bans]
# 同一 crate 多版本并存只告警：体积/攻击面需人工判断，不阻断本地 CI。
multiple-versions = "warn"
# 禁止 `*` 通配版本依赖：版本必须可复现（SPEC.md §9.5 版本以实测为准）。
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
# 只允许 crates.io 官方索引；git 依赖默认禁止（任何联网/新后端需 Ask first）。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
