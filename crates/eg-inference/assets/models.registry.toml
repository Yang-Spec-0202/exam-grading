# exam-grading 模型注册表（随发行版发布，只读）
#
# 事实来源（2026-11-02 实测，见 docs/dev/research/models.md 与 inference-serving.md）：
# - 权重文件、字节数、SHA-256 与 scripts/model/registry.tsv 一致（由 pull.sh 下载后用
#   verify.sh 复核）；
# - 端口与 serving 参数与 scripts/model/profiles.tsv 一致（serve.sh 用同一组值）；
# - 许可来自各自 Hugging Face 模型卡。
#
# 规则：
# 1. 未在本注册表内登记的模型**不得加载**；配置指向未登记 id 时启动即失败，不静默回退。
# 2. 许可过白名单门禁（SPEC-inference.md §2.4，fail-closed）；命中排除清单必须带
#    license_review 人工评审引用。
# 3. local_server 下 implementation 默认 llama.cpp；MLX 需独立登记并单独验收。
# 4. 同一 serve_unit 的条目共享一个 llama-server 进程（同权重、同端口），
#    router/structurer 复用判定模型即通过 serve_unit 表达。
# 5. 云端条目只登记地址、模型名与价格，**不登记任何凭据**（credentials_env 只写变量名）。

schema_version = 1

# ───────────────────────── 默认 OCR：PaddleOCR-VL-1.6（官方 BF16） ─────────────────────────
[[models]]
id = "paddleocr-vl-1.6"
version = "1.6"
role = "ocr"
backend = "local_server"
implementation = "llama.cpp"
quantization = "bf16"
context_length = 8192
license = "Apache-2.0"
max_concurrency = 1
timeout_secs = 60
prompt_schema_version = "ocr.blocks.v1"
description = "默认 OCR（CONFIG.md ocr.model）：官方 GGUF 为 BF16，双文件约 1.8GB；热启动 0.8-2.5s、首次读盘 10-11s"

[models.local]
binary = "llama-server"
port = 8081
startup_timeout_secs = 12
extra_args = []

[[models.weights]]
component = "model"
file = "model.gguf"
sha256 = "f3ae46ec885050acf4b3d31944431e1fd90d50664fb09126af4a3c050ba14ee8"
bytes = 935769056

[[models.weights]]
component = "mmproj"
file = "mmproj.gguf"
sha256 = "204d757d7610d9b3faab10d506d69e5b244e32bf765e2bab2d0167e65e0a058a"
bytes = 881770560

