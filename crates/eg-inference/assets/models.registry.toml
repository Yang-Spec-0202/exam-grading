# ───────────────────────── 默认判定：Qwen3.5-4B Q4_K_M（关 thinking） ─────────────────────────
[[models]]
id = "qwen3.5-4b-instruct"
version = "3.5"
role = "judge"
backend = "local_server"
implementation = "llama.cpp"
quantization = "q4_k_m"
context_length = 8192
license = "Apache-2.0"
max_concurrency = 1
timeout_secs = 20
prompt_schema_version = "judge.outcome.v1"
calibration_table = "config/calibration/qwen35-4b-q4-iso-v1.json"
description = "默认判定（CONFIG.md grade.model_profile）：4B 指令模型 + 受限 JSON；Qwen3 系列必须关闭 thinking，否则 content 为空"

[models.local]
binary = "llama-server"
port = 8082
startup_timeout_secs = 12
# 关键参数：Qwen3.5 的 chat template 用 enable_thinking 控制；不关会只返回 reasoning 而 content 为空。
extra_args = ["--chat-template-kwargs", "{\"enable_thinking\":false}"]

[[models.weights]]
component = "model"
file = "model.gguf"
sha256 = "00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4"
bytes = 2740937888

