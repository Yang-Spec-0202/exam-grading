# ───────────────────────── 云端兜底预设：DeepSeek（默认关闭，逐任务授权） ─────────────────────────
[[models]]
id = "deepseek-flash"
version = "DeepSeek-V4.1-Flash-1017"
role = "judge"
backend = "openai_compat"
quantization = "remote"
context_length = 1048576
license = "Apache-2.0"
max_concurrency = 4
timeout_secs = 120
prompt_schema_version = "judge.outcome.v1"
description = "云端兜底（OpenAI 兼容）。默认关闭：需 privacy.cloud_enabled + 该任务 TaskConsent 双重门禁；本地优先、失败显式，绝不静默降级"

[models.cloud]
base_url = "https://api.deepseek.com"
model_name = "deepseek-flash"
credentials_env = "DEEPSEEK_API_KEY"
# 价格：每百万 token 的微元（1 元 = 1_000_000 微元）；空闲/高峰两档，来自官方文档 2026-11-02。
input_cache_miss_idle_micros = 1000000
input_cache_miss_peak_micros = 2000000
input_cache_hit_idle_micros = 20000
input_cache_hit_peak_micros = 40000
output_idle_micros = 4000000
output_peak_micros = 8000000
