[package]
name = "eg-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "配置、密钥、数据库、资产库、持久任务、日志、审计、单实例、崩溃恢复"

[lints]
workspace = true

[dependencies]
blake3 = "1"
chrono = "0.4"
eg-domain = { workspace = true }
fs2 = "0.4"
keyring = "4"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
ulid = { version = "3", features = ["serde"] }
# zip 只用于诊断包导出/读取；默认特性会引入 bzip2 / ppmd / lzma / zstd / xz 等
# 未被本模块使用的压缩后端（其中 libbz2-rs-sys 的 bzip2-1.0.6 许可与 ppmd-rust 的
# CC0-1.0 OR MIT-0 均不在 deny.toml 白名单内），因此显式关闭默认特性，只保留
# rust 后端 deflate（flate2/zlib-rs，纯 Rust，无需系统 zlib）。
# 来源：crates.io zip 9.2.2 的 Cargo.toml `[features]` 实测（2026-11-02，
# docs/dev/research/platform.md §来源 S9）。
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
proptest = "1"
tempfile = "3"
