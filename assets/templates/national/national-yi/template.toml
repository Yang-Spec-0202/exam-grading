# -----------------------------------------------------------------------------
# 评分项骨架库（被 questions.skeleton 引用）
#
# 所有条目均为通用占位：placeholder = true，criterion 以「【模板骨架】」开头。
# 静态校验会以「判据仍为模板占位」错误级拦截，直到教师替换为本题具体判据。
# 分值用 ratio_permille（千分比）表达，套用时按 题目满分 × 比例 折算；
# 比例均为 100‰ 的整数倍，保证在以 0.1 分为粒度时可精确折算。
# -----------------------------------------------------------------------------

[skeletons.objective-single]
scoring_mode = "全对才给分"
label = "客观题·单选"
scoring_note = "单选只有全对与全错两档；等价写法不适用于选择题。"
[[skeletons.objective-single.items]]
ordinal = 1
criterion = "【模板骨架】选出唯一正确选项，与答案键一致；错选、多选、少选均不得分"
ratio_permille = 1000
required = true
depends_on = []
placeholder = true

[skeletons.objective-blank]
scoring_mode = "全对才给分"
label = "客观题·填空"
scoring_note = "填空题按答案键与等价规则判定；是否接受未化简结果、单位与取值范围须教师按题目要求明确。"
[[skeletons.objective-blank.items]]
ordinal = 1
criterion = "【模板骨架】填入结果与答案键等价（含等价写法、单位、取值范围与必要化简）"
ratio_permille = 1000
required = true
depends_on = []
placeholder = true

[skeletons.step-compute]
scoring_mode = "分步给分"
label = "解答题·通用计算/求解骨架"
scoring_note = "通用三步骨架，不承诺与官方评分细则一致；依赖为空表示可独立累加（不强制前置命中）。教师若需要「前置必须命中」语义，须补 depends_on。"
[[skeletons.step-compute.items]]
ordinal = 1
criterion = "【模板骨架】关键建模、转化或方法选择正确（如设元、列式、建系、构造函数、分类讨论起点）"
ratio_permille = 300
required = false
depends_on = []
placeholder = true
[[skeletons.step-compute.items]]
ordinal = 2
criterion = "【模板骨架】主要运算/推理过程基本完成，关键中间结论正确"
ratio_permille = 400
required = false
depends_on = []
placeholder = true
[[skeletons.step-compute.items]]
ordinal = 3
criterion = "【模板骨架】最终结论正确且符合题意（取值范围、单位、检验、取舍）"
ratio_permille = 300
required = false
depends_on = []
placeholder = true

[skeletons.step-proof]
scoring_mode = "分步给分"
label = "解答题·通用证明骨架"
scoring_note = "证明题通用骨架；依赖链表达「先构造后推理、最后结论」的常规顺序。若当年证明不要求先构造，教师应删减依赖。"
[[skeletons.step-proof.items]]
ordinal = 1
criterion = "【模板骨架】明确已知与求证，写出关键辅助构造（辅助线、辅助函数、坐标系、反设等）"
ratio_permille = 300
required = false
depends_on = []
placeholder = true
[[skeletons.step-proof.items]]
ordinal = 2
criterion = "【模板骨架】推理链条完整：每步给出依据（定义、定理、公式、性质），无跳步"
ratio_permille = 400
required = false
depends_on = [1]
placeholder = true
[[skeletons.step-proof.items]]
ordinal = 3
criterion = "【模板骨架】结论成立且表述规范（范围、等号成立条件、反证收尾）"
ratio_permille = 300
required = false
depends_on = [1, 2]
placeholder = true
