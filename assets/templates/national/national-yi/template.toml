# =============================================================================
# exam-grading · 全国卷数学模板数据（结构快照 · 历史卷）
#
# 本文件只描述「试卷结构 + 分值 + 通用评分项骨架」，不包含任何题目原文。
# 格式与字段定义：assets/templates/README.md
# 来源、置信度与不确定项：docs/dev/research/templates.md
#
# 状态说明：全国乙卷自 2024 年起停止命制，原乙卷省份改用全国甲卷/新课标卷。
# 本模板保留为「历史卷快照」，供批改 2023 及以前试卷时套用；
# 2024 及以后的新卷请使用全国甲卷 / 新课标Ⅰ卷 / 新课标Ⅱ卷模板。
# =============================================================================

schema_version = 1

template_id = "national-yi"
set_id = "national-yi"
display_name = "全国乙卷"
subject = "math"
paper_style = "old-gaokao"            # new-gaokao | old-gaokao
status = "retired"                    # active | retired
retired_since = 2024                  # 2024 年起停止命制（并入全国甲卷）
version = "2023.1"
snapshot_year = 2023
snapshot_label = "2021–2023 年卷结构（老高考 22 题结构，最后使用年 2023）"
total_score_milli = 150000            # 千分之一分：150 分
question_count = 22                   # 作答题目数（卷面题号到 23）
printed_max_ordinal = 23              # 卷面最大题号：22/23 为二选一，合并为一条
structure_note = "12 单选（5 分）+ 4 填空（5 分）+ 5 必做解答（各 12 分）+ 1 道二选一选做题（22/23，10 分），作答 22 题；无多项选择；文/理同结构（题量与分值一致，内容不同）"
structure_confidence = "high"         # 题量/题型/各题型总分：公开真题与官方评析可核
score_split_confidence = "medium"     # 解答题逐题分值：公开真题资料推定（17–21 各 12 分、22/23 各 10 分）

[provenance]
verified_at = "2026-11-02"
confidence = "medium"
basis = "public-analysis"
source_ids = ["S1", "S6", "S7"]
disclaimer = "仅记录结构与分值；不含题目原文；评分项骨架为通用占位，不是官方评分细则，须教师逐项确认后方可用于判分。本卷型 2024 年起停止命制，模板仅作历史快照保留。"

