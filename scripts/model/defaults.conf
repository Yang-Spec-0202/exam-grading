# defaults.conf — configurable defaults for the exam-grading model scripts.
#
# Sourced by lib.sh. Every entry uses ${VAR:-default}, so an inherited
# environment variable always wins. Override on the command line, e.g.:
#     MODELS_DIR=/tmp/models ./pull.sh --dry-run
#     OCR_MODEL=glm-ocr ./serve.sh start ocr
#
# This file must never contain secrets. Cloud API keys are read only from the
# environment (DEEPSEEK_API_KEY) by the application, never here (CONFIG.md §10).

# --- default model per role (ids must exist in registry.tsv) -----------------
# CONFIG.md §4 ocr.model      -> PaddleOCR-VL-1.6 (0.9B Q4)
# CONFIG.md §5 grade.model_profile -> 4B instruction model + restricted output
: "${DEFAULT_OCR_MODEL:=paddleocr-vl-1.6}"
: "${DEFAULT_JUDGE_MODEL:=qwen3.5-4b-instruct}"

# --- where weights live (never inside the repository) -----------------------
# macOS user data directory; matches SPEC-platform.md / CONFIG.md §9.5.
: "${EG_DATA_DIR:=$HOME/Library/Application Support/exam-grading}"
: "${MODELS_DIR:=$EG_DATA_DIR/models}"
: "${STAGING_DIR:=$MODELS_DIR/.downloads}"

# --- sidecar runtime state --------------------------------------------------
: "${MODEL_LOG_DIR:=$EG_DATA_DIR/logs/model}"
: "${MODEL_RUN_DIR:=$EG_DATA_DIR/run}"

# --- download behaviour -----------------------------------------------------
# Public Hugging Face endpoint. Point at an HF mirror here if needed.
: "${HF_ENDPOINT:=https://huggingface.co}"
: "${HF_TOKEN:=}"                 # optional; only read from env, never written
: "${RETRY_MAX:=5}"               # curl --retry
: "${RETRY_DELAY_S:=2}"           # curl --retry-delay
: "${CONNECT_TIMEOUT_S:=15}"      # curl --connect-timeout
: "${STALL_SPEED_BYTES:=1024}"    # slow-transfer abort threshold
: "${STALL_TIME_S:=60}"           # ... sustained for this many seconds
# Guard from the task brief: report before downloading anything bigger than
# 5 GiB. pull.sh refuses unless --allow-large is passed.
: "${LARGE_DOWNLOAD_BYTES:=5368709120}"

# --- serving lifecycle ------------------------------------------------------
# SPEC-inference.md §4 targets <=8 s cold start on this hardware; the script
# timeout is generous on purpose (first run may page the weights in from disk).
: "${STARTUP_TIMEOUT_S:=90}"
: "${STOP_TIMEOUT_S:=10}"
: "${HEALTH_TIMEOUT_S:=5}"

# --- license gate (mirrors SPEC-inference.md §2.4 and deny.toml) ------------
: "${LICENSE_ALLOWLIST:=MIT Apache-2.0 BSD-3-Clause ISC Unicode-3.0}"
